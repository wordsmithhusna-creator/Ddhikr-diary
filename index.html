<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style></head><body>
<title>Dhikr Diary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column (max 520px), scrolling content, fixed 5-tab bar at the bottom, bottom sheets for forms and reminders. */
:root{
  --bg:#EDF3EF; --surface:#FFFFFF; --surface-2:#E4EDE8; --ink:#10241B; --muted:#58695F; --line:#D3DFD8;
  --green:#0F5132; --on-green:#FFFFFF; --green-soft:#D6EADF;
  --gold:#9A6E14; --gold-soft:#F2E5C2; --crit:#B3402F;
  --shadow:0 1px 2px rgba(16,36,27,.06),0 8px 22px rgba(16,36,27,.07);
  --overlay:rgba(8,20,14,.5);
  --f-body:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-ar:'Amiri','Traditional Arabic','Noto Naskh Arabic',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1510; --surface:#12231B; --surface-2:#1A3026; --ink:#E5EFE9; --muted:#97AB9F; --line:#24402F;
  --green:#62C79A; --on-green:#07150E; --green-soft:#1B3A2C;
  --gold:#E3B95A; --gold-soft:#3A3012; --crit:#F08A78;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35); --overlay:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1510; --surface:#12231B; --surface-2:#1A3026; --ink:#E5EFE9; --muted:#97AB9F; --line:#24402F;
  --green:#62C79A; --on-green:#07150E; --green-soft:#1B3A2C;
  --gold:#E3B95A; --gold-soft:#3A3012; --crit:#F08A78;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35); --overlay:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
.app{max-width:520px;margin:0 auto;padding:20px 0 112px;min-width:0}
.hero{padding:6px 2px 16px}
.eyebrow{color:var(--gold);font-weight:600;font-size:14px}
.hero h1{font-size:30px;line-height:1.25;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:15px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:16px;font-weight:600;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--green);color:var(--on-green)}
.btn.danger{color:var(--crit)}
.btn.block{width:100%}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.ck:focus-visible,.cell:focus-visible,.sw:focus-visible,.tap:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:500;white-space:nowrap;flex:0 0 auto}
.chip.on{background:var(--green);color:var(--on-green);box-shadow:none}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:38px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ring{display:block}.rt{fill:none;stroke:var(--line)}.rf{fill:none;stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .3s}
.today{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.ringbox{position:relative;width:96px;height:96px}
.ringbox .ring{width:96px;height:96px}
.ringbox b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;color:var(--green)}
.next{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--gold-soft);font-size:14px}
.next b{font-weight:600}
.pray{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pray button{min-height:64px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;font-size:14px}
.pray button span{font-size:12px;color:var(--muted);font-weight:400}
.pray button.on{background:var(--green);color:var(--on-green)}
.pray button.on span{color:var(--on-green);opacity:.85}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.ck{flex:0 0 28px;width:28px;height:28px;border-radius:9px;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center}
.ck[aria-pressed="true"]{background:var(--green);box-shadow:none;color:var(--on-green)}
.ck svg{width:16px;height:16px;opacity:0}.ck[aria-pressed="true"] svg{opacity:1}
.tx{flex:1;min-width:0;text-align:left}
.tt{display:block;font-weight:500;overflow-wrap:anywhere}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.meta{display:block;font-size:13px;color:var(--muted)}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--gold-soft);color:var(--gold)}
.tag.late{background:transparent;color:var(--crit);box-shadow:inset 0 0 0 1px var(--crit)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:14px;background:var(--gold-soft);font-size:14px}
.banner button{font-weight:600;color:var(--gold);white-space:nowrap;min-height:36px}
.counter{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.ar{font-family:var(--f-ar);font-size:34px;line-height:1.9;text-wrap:balance;max-width:100%}
.mean{color:var(--muted);font-size:14px;text-wrap:balance}
.tap{position:relative;width:196px;height:196px;border-radius:50%;background:var(--green-soft);margin:10px 0 6px;display:grid;place-items:center;transition:transform .08s}
.tap:active{transform:scale(.96)}
.tap .ring{position:absolute;inset:0;width:100%;height:100%}
.tap .in{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.tap .num{font-size:56px;font-weight:700;color:var(--green);font-feature-settings:"tnum"}
.tap .of{font-size:14px;color:var(--muted);margin-top:4px}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .nm{font-weight:600;text-align:left;overflow-wrap:anywhere}
.bar-t{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--green);border-radius:99px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);position:relative;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .18s}
.sw[aria-pressed="true"]{background:var(--green)}
.sw[aria-pressed="true"]::after{transform:translateX(20px);background:var(--on-green)}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.calhead h2{margin:0;font-size:18px;text-align:center;flex:1}
.calhead .sub{font-size:13px;display:block;font-weight:400}
.round{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:20px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;font-size:12px;color:var(--muted);padding-bottom:2px}
.cell{aspect-ratio:1/1.05;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-weight:600;position:relative;background:var(--surface-2);min-width:0}
.cell small{font-size:10px;font-weight:400;color:var(--muted);line-height:1}
.cell.l1{background:color-mix(in srgb,var(--green) 22%,var(--surface))}
.cell.l2{background:color-mix(in srgb,var(--green) 42%,var(--surface))}
.cell.l3{background:color-mix(in srgb,var(--green) 68%,var(--surface))}
.cell.l4{background:var(--green);color:var(--on-green)}
.cell.l4 small,.cell.l3 small{color:inherit;opacity:.8}
.cell.fri b{color:var(--gold)}.cell.l4.fri b{color:var(--on-green)}
.cell.today{box-shadow:inset 0 0 0 2px var(--gold)}
.cell.void{background:transparent;pointer-events:none}
.cell.future{opacity:.5}
.cell .dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{width:16px;height:16px;border-radius:5px;display:block}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .val{fill:var(--ink);font-size:10px;font-weight:600;font-family:var(--f-body)}
.chart .bar{fill:color-mix(in srgb,var(--green) 40%,var(--surface))}
.chart .bar.cur{fill:var(--green)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface-2);border-radius:14px;padding:12px}
.tile b{display:block;font-size:24px;line-height:1.2;color:var(--green)}
.tile span{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{width:100%;min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:84px;font-size:13px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--green)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{min-width:28px;text-align:center}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);padding:10px 12px;border-radius:12px;margin-top:10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);border-radius:12px;font-weight:500}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--green);font-weight:600}
.tab[aria-current="page"] svg{stroke-width:2.3}
.ov{position:fixed;inset:0;z-index:40;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.sheet h2{font-size:18px;margin-bottom:12px}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.rem .ar{font-size:38px}
.btns{display:flex;gap:10px;margin-top:14px}.btns .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.ln{padding:12px 0;border-top:1px solid var(--line);text-align:center}
.ln:first-of-type{border-top:0}
.read .ar{font-size:30px}
.read .between{margin-bottom:6px}
.pr{color:var(--green);font-weight:500;font-size:15px;margin:2px 0 4px}
.src{margin-top:8px}
.rem .ar{font-size:30px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app"><main id="view" class="stack"></main></div>

<nav class="tabs" aria-label="প্রধান মেনু"><div class="in" id="tabs"></div></nav>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';
var KEY='dhikrDiary.v1';
var $=function(s){return document.querySelector(s)};
var DAYS=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
var DS=['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি'];
var MONTHS=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
var MS=['জানু','ফেব্রু','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টে','অক্টো','নভে','ডিসে'];
var HM=['মুহাররম','সফর','রবিউল আউয়াল','রবিউস সানি','জমাদিউল আউয়াল','জমাদিউস সানি','রজব','শাবান','রমজান','শাওয়াল','জিলকদ','জিলহজ'];

ওয়া ইল্লাম তাগফির লানা ওয়া তারহামনা লানাকূনান্না মিনাল খাসিরীন"],"m":["হে আমাদের রব, আমরা নিজেদের উপর জুলুম করেছি। যদি আপনি আমাদের ক্ষমা না করেন ও দয়া না করেন, তবে অবশ্যই আমরা ক্ষতিগ্রস্তদের অন্তর্ভুক্ত হব।"],"s":"কুরআন ৭:২৩"},{"id":"q03","name":"ইলম বৃদ্ধির দুআ","cat":"dua","t":1,"r":true,"d":false,"a":["رَّبِّ زِدْنِى عِلْمًا"],"u":["রাব্বি যিদনী ইলমা"],"m":["হে আমার রব, আমার জ্ঞান বাড়িয়ে দিন।"],"s":"কুরআন ২০:১১৪"},{"id":"q04","name":"মূসা (আ.)-এর দুআ (কাজ সহজ হওয়ার জন্য)","cat":"dua","t":1,"r":false,"d":false,"a":["رَبِّ ٱشْرَحْ لِى صَدْرِى وَيَسِّرْ لِىٓ أَمْرِى وَٱحْلُلْ عُقْدَةً مِّن لِّسَانِى يَفْقَهُوا۟ قَوْلِى"],"u":["রাব্বিশরাহ লী সাদরী, ওয়া ইয়াসসির লী আমরী, ওয়াহলুল উকদাতাম মিল লিসানী, ইয়াফকাহূ কাওলী"],"m":["হে আমার রব, আমার বক্ষ প্রশস্ত করে দিন, আমার কাজ সহজ করে দিন, আমার জিহ্বার জড়তা দূর করুন, যাতে তারা আমার কথা বুঝতে পারে।"],"s":"কুরআন ২০:২৫-২৮"},{"id":"q05","name":"পরিবারের জন্য দুআ","cat":"dua","t":1,"r":false,"d":false,"a":["رَبَّنَا هَبْ لَنَا مِنْ أَزْوَٰجِنَا وَذُرِّيَّٰتِنَا قُرَّةَ أَعْيُنٍ وَٱجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا"],"u":["রাব্বানা হাব লানা মিন আযওয়াজিনা ওয়া যুররিয়্যাতিনা কুররাতা আ'ইউনিঁও ওয়াজ'আলনা লিল মুত্তাকীনা ইমামা"],"m":["হে আমাদের রব, আমাদের স্ত্রী ও সন্তানদের পক্ষ থেকে আমাদের চোখের শীতলতা দান করুন এবং আমাদের মুত্তাকিদের নেতা বানান।"],"s":"কুরআন ২৫:৭৪"},{"id":"q06","name":"নিজের, পিতামাতার ও মুমিনদের জন্য ক্ষমা","cat":"dua","t":1,"r":false,"d":false,"a":["رَّبِّ ٱغْفِرْ لِى وَلِوَٰلِدَىَّ وَلِمَن دَخَلَ بَيْتِىَ مُؤْمِنًا وَلِلْمُؤْمِنِينَ وَٱلْمُؤْمِنَٰتِ"],"u":["রাব্বিগফির লী ওয়ালি ওয়ালিদাইয়্যা ওয়ালিমান দাখালা বাইতিয়া মু'মিনাঁও ওয়ালিল মু'মিনীনা ওয়াল মু'মিনাত"],"m":["হে আমার রব, আমাকে, আমার পিতামাতাকে, আমার ঘরে প্রবেশকারী মুমিনকে এবং সকল মুমিন নর-নারীকে ক্ষমা করুন।"],"s":"কুরআন ৭১:২৮"},{"id":"q07","name":"পিতামাতার জন্য দুআ","cat":"dua","t":1,"r":true,"d":false,"a":["رَّبِّ ٱرْحَمْهُمَا كَمَا رَبَّيَانِى صَغِيرًا"],"u":["রাব্বির হামহুমা কামা রাব্বাইয়ানী সাগীরা"],"m":["হে আমার রব, তাঁদের দুজনের প্রতি দয়া করুন, যেমন তাঁরা শৈশবে আমাকে লালন-পালন করেছেন।"],"s":"কুরআন ১৭:২৪"},{"id":"q08","name":"অন্তরের দৃঢ়তার দুআ","cat":"dua","t":1,"r":false,"d":false,"a":["رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ ٱلْوَهَّابُ"],"u":["রাব্বানা লা তুযিগ কুলূবানা বা'দা ইয হাদাইতানা ওয়া হাব লানা মিল লাদুনকা রাহমাহ, ইন্নাকা আনতাল ওয়াহহাব"],"m":["হে আমাদের রব, হেদায়েত দেওয়ার পর আমাদের অন্তর বাঁকা করবেন না এবং আপনার পক্ষ থেকে আমাদের রহমত দান করুন। নিশ্চয়ই আপনি মহান দাতা।"],"s":"কুরআন ৩:৮"},{"id":"q09","name":"আমল কবুলের দুআ","cat":"dua","t":1,"r":false,"d":false,"a":["رَبَّنَا تَقَبَّلْ مِنَّآ ۖ إِنَّكَ أَنتَ ٱلسَّمِيعُ ٱلْعَلِيمُ"],"u":["রাব্বানা তাকাব্বাল মিন্না, ইন্নাকা আনতাস সামীউল আলীম"],"m":["হে আমাদের রব, আমাদের পক্ষ থেকে কবুল করুন। নিশ্চয়ই আপনি সর্বশ্রোতা, সর্বজ্ঞ।"],"s":"কুরআন ২:১২৭"},{"id":"q10","name":"নামাজ কায়েমের দুআ","cat":"dua","t":1,"r":false,"d":false,"a":["رَبِّ ٱجْعَلْنِى مُقِيمَ ٱلصَّلَوٰةِ وَمِن ذُرِّيَّتِى ۚ رَبَّنَا وَتَقَبَّلْ دُعَآءِ","رَبَّنَا ٱغْفِرْ لِى وَلِوَٰلِدَىَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ ٱلْحِسَابُ"],"u":["রাব্বিজ'আলনী মুকীমাস সালাতি ওয়ামিন যুররিয়্যাতী, রাব্বানা ওয়া তাকাব্বাল দুআ","রাব্বানাগফির লী ওয়ালি ওয়ালিদাইয়্যা ওয়ালিল মু'মিনীনা ইয়াওমা ইয়াকূমুল হিসাব"],"m":["হে আমার রব, আমাকে ও আমার সন্তানদের নামাজ কায়েমকারী বানান। হে আমাদের রব, আমার দুআ কবুল করুন।","হে আমাদের রব, হিসাবের দিনে আমাকে, আমার পিতামাতাকে ও মুমিনদের ক্ষমা করুন।"],"s":"কুরআন ১৪:৪০-৪১ (ইবরাহিম আ.-এর দুআ)"},{"id":"q11","name":"প্রয়োজনের দুআ (মূসা আ.)","cat":"dua","t":1,"r":false,"d":false,"a":["رَبِّ إِنِّى لِمَآ أَنزَلْتَ إِلَىَّ مِنْ خَيْرٍ فَقِيرٌ"],"u":["রাব্বি ইন্নী লিমা আনযালতা ইলাইয়্যা মিন খাইরিন ফাকীর"],"m":["হে আমার রব, আপনি আমার প্রতি যে কল্যাণই নাযিল করুন, আমি তার মুখাপেক্ষী।"],"s":"কুরআন ২৮:২৪"},{"id":"h01","name":"ঘুমানোর দুআ","cat":"dua","t":1,"r":false,"d":false,"a":["بِٱسْمِكَ ٱللَّهُمَّ أَمُوتُ وَأَحْيَا"],"u":["বিসমিকাল্লাহুম্মা আমূতু ওয়া আহইয়া"],"m":["হে আল্লাহ, আপনার নামেই আমি মরি (ঘুমাই) এবং বাঁচি (জাগি)।"],"s":"সহিহ বুখারি"},{"id":"h02","name":"ঘুম থেকে উঠার দুআ","cat":"dua","t":1,"r":false,"d":false,"a":["ٱلْحَمْدُ لِلَّهِ ٱلَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ ٱلنُّشُورُ"],"u":["আলহামদু লিল্লাহিল্লাযী আহইয়ানা বা'দা মা আমাতানা ওয়া ইলাইহিন নুশূর"],"m":["সকল প্রশংসা আল্লাহর, যিনি আমাদের মৃত্যুর (ঘুমের) পর জীবিত করেছেন, আর তাঁর কাছেই পুনরুত্থান।"],"s":"সহিহ বুখারি"},{"id":"h03","name":"খাওয়ার আগের দুআ","cat":"dua","t":1,"r":false,"d":false,"a":["بِسْمِ ٱللَّهِ"],"u":["বিসমিল্লাহ"],"m":["আল্লাহর নামে শুরু করছি। (ভুলে গেলে মনে পড়লে: বিসমিল্লাহি আউওয়ালাহূ ওয়া আখিরাহ)"],"s":"সহিহ বুখারি ও মুসলিম, আবু দাউদ"},{"id":"h04","name":"খাওয়ার পরের দুআ","cat":"dua","t":1,"r":false,"d":false,"a":["ٱلْحَمْدُ لِلَّهِ حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ غَيْرَ مَكْفِيٍّ وَلَا مُوَدَّعٍ وَلَا مُسْتَغْنًى عَنْهُ رَبَّنَا"],"u":["আলহামদু লিল্লাহি হামদান কাসীরান তাইয়্যিবান মুবারাকান ফীহি, গাইরা মাকফিইয়িঁও ওয়ালা মুওয়াদ্দা'ইঁও ওয়ালা মুসতাগনান আনহু রাব্বানা"],"m":["আল্লাহর অনেক পবিত্র ও বরকতময় প্রশংসা, যা কখনো যথেষ্ট হয় না, ছাড়া যায় না এবং যা থেকে অমুখাপেক্ষী হওয়া যায় না, হে আমাদের রব।"],"s":"সহিহ বুখারি"},{"id":"h05","name":"ঘর থেকে বের হওয়ার দুআ","cat":"dua","t":1,"r":false,"d":false,"a":["بِسْمِ ٱللَّهِ تَوَكَّلْتُ عَلَى ٱللَّهِ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِٱللَّهِ"],"u":["বিসমিল্লাহি তাওয়াক্কালতু আলাল্লাহি ওয়ালা হাওলা ওয়ালা কুওয়াতা ইল্লা বিল্লাহ"],"m":["আল্লাহর নামে, আল্লাহর উপর ভরসা করলাম; আল্লাহর সাহায্য ছাড়া কোনো উপায় ও শক্তি নেই।"],"s":"আবু দাউদ, তিরমিযি (সহিহ)"},{"id":"h06","name":"মসজিদে প্রবেশের দুআ","cat":"dua","t":1,"r":false,"d":false,"a":["ٱللَّهُمَّ ٱفْتَحْ لِي أَبْوَابَ رَحْمَتِكَ"],"u":["আল্লাহুম্মাফতাহ লী আবওয়াবা রাহমাতিক"],"m":["হে আল্লাহ, আমার জন্য আপনার রহমতের দরজাগুলো খুলে দিন।"],"s":"সহিহ মুসলিম"},{"id":"h07","name":"মসজিদ থেকে বের হওয়ার দুআ","cat":"dua","t":1,"r":false,"d":false,"a":["ٱللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ"],"u":["আল্লাহুম্মা ইন্নী আসআলুকা মিন ফাদলিক"],"m":["হে আল্লাহ, আম ্লাম ইয়ানতাহি লানাসফা'আম বিন-নাসিয়াহ","নাসিয়াতিন কাযিবাতিন খাতিয়াহ","ফালইয়াদ'উ নাদিয়াহ","সানাদ'উয যাবানিয়াহ","কাল্লা লা তুতি'হু ওয়াসজুদ ওয়াকতারিব"],"m":["পড়ুন আপনার রবের নামে, যিনি সৃষ্টি করেছেন।","সৃষ্টি করেছেন মানুষকে জমাট রক্ত থেকে।","পড়ুন, আর আপনার রব মহা সম্মানিত,","যিনি কলমের মাধ্যমে শিক্ষা দিয়েছেন।","শিক্ষা দিয়েছেন মানুষকে যা সে জানত না।","না, বরং মানুষ সীমালঙ্ঘন করে,","কারণ সে নিজেকে অভাবমুক্ত মনে করে।","নিশ্চয়ই আপনার রবের কাছেই ফিরে যেতে হবে।","আপনি কি তাকে দেখেছেন, যে নিষেধ করে","এক বান্দাকে, যখন সে নামাজ পড়ে?","আপনি কি দেখেছেন, যদি সে হেদায়েতের উপর থাকে","অথবা তাকওয়ার নির্দেশ দেয়?","আপনি কি দেখেছেন, যদি সে অস্বীকার করে ও মুখ ফিরিয়ে নেয়?","সে কি জানে না যে আল্লাহ দেখছেন?","না, সে যদি বিরত না হয়, তবে আমি অবশ্যই তার কপালের চুল ধরে টেনে নেব,","মিথ্যাবাদী, পাপী কপালের চুল।","তখন সে তার সঙ্গী-সাথীদের ডাকুক।","আমিও ডাকব জাহান্নামের প্রহরীদের।","না, তার কথা মানবেন না; সিজদা করুন ও (আল্লাহর) নৈকট্য লাভ করুন।"],"s":"কুরআন ৯৬:১-১৯ (১৯ নং আয়াতে তিলাওয়াতের সিজদা)"},{"id":"s097","name":"সূরা আল-কদর","cat":"sura","t":1,"r":false,"d":false,"a":["إِنَّآ أَنزَلْنَٰهُ فِى لَيْلَةِ ٱلْقَدْرِ","وَمَآ أَدْرَىٰكَ مَا لَيْلَةُ ٱلْقَدْرِ","لَيْلَةُ ٱلْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ","تَنَزَّلُ ٱلْمَلَٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ","سَلَٰمٌ هِىَ حَتَّىٰ مَطْلَعِ ٱلْفَجْرِ"],"u":["ইন্না আনযালনাহু ফী লাইলাতিল কাদর","ওয়ামা আদরাকা মা লাইলাতুল কাদর","লাইলাতুল কাদরি খাইরুম মিন আলফি শাহর","তানাযযালুল মালাইকাতু ওয়ার-রূহু ফীহা বিইযনি রাব্বিহিম মিন কুল্লি আমর","সালামুন হিয়া হাত্তা মাতলাইল ফাজর"],"m":["নিশ্চয়ই আমি এটি (কুরআন) নাযিল করেছি কদরের রাতে।","আর আপনি কি জানেন কদরের রাত কী?","কদরের রাত হাজার মাসের চেয়ে উত্তম।","সে রাতে ফেরেশতারা ও রূহ (জিবরাইল) প্রতিটি কাজের জন্য তাদের রবের অনুমতিক্রমে অবতরণ করে।","শান্তিই শান্তি, ফজরের উদয় পর্যন্ত।"],"s":"কুরআন ৯৭:১-৫"},{"id":"s098","name":"সূরা আল-বাইয়্যিনাহ","cat":"sura","t":1,"r":false,"d":false,"a":["لَمْ يَكُنِ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَٰبِ وَٱلْمُشْرِكِينَ مُنفَكِّينَ حَتَّىٰ تَأْتِيَهُمُ ٱلْبَيِّنَةُ","رَسُولٌ مِّنَ ٱللَّهِ يَتْلُوا۟ صُحُفًا مُّطَهَّرَةً","فِيهَا كُتُبٌ قَيِّمَةٌ","وَمَا تَفَرَّقَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ إِلَّا مِنۢ بَعْدِ مَا جَآءَتْهُمُ ٱلْبَيِّنَةُ","وَمَآ أُمِرُوٓا۟ إِلَّا لِيَعْبُدُوا۟ ٱللَّهَ مُخْلِصِينَ لَهُ ٱلدِّينَ حُنَفَآءَ وَيُقِيمُوا۟ ٱلصَّلَوٰةَ وَيُؤْتُوا۟ ٱلزَّكَوٰةَ ۚ وَذَٰلِكَ دِينُ ٱلْقَيِّمَةِ","إِنَّ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَٰبِ وَٱلْمُشْرِكِينَ فِى نَارِ جَهَنَّمَ خَٰلِدِينَ فِيهَآ ۚ أُو۟لَٰٓئِكَ هُمْ شَرُّ ٱلْبَرِيَّةِ","إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ أُو۟لَٰٓئِكَ هُمْ خَيْرُ ٱلْبَرِيَّةِ","جَزَآؤُهُمْ عِندَ رَبِّهِمْ جَنَّٰتُ عَدْنٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ خَٰلِدِينَ فِيهَآ أَبَدًا ۖ رَّضِىَ ٱللَّهُ عَنْهُمْ وَرَضُوا۟ عَنْهُ ۚ ذَٰلِكَ لِمَنْ خَشِىَ رَبَّهُۥ"],"u":["লাম ইয়াকুনিল্লাযীনা কাফারূ মিন আহলিল কিতাবি ওয়াল মুশরিকীনা মুনফাক্কীনা হাত্তা তা'তিয়াহুমুল বাইয়্যিনাহ","রাসূলুম মিনাল্লাহি ইয়াতলূ সুহুফাম মুতাহহারাহ","ফীহা কুতুবুন কাইয়্যিমাহ","ওয়ামা তাফাররাকাল্লাযীনা ঊতুল কিতাবা ইল্লা মিম বা'দি মা জাআতহুমুল বাইয়্যিনাহ","ওয়ামা উমিরূ ইল্লা লিইয়া'বুদুল্লাহা মুখলিসীনা লাহুদ দীনা হুনাফাআ ওয়া ইউকীমুস সালাতা ওয়া ইউ'তুয যাকাতা ওয়া যালিকা দীনুল কাইয়্যিমাহ","ইন্নাল্লাযীনা কাফারূ মিন আহলিল কিতাবি ওয়াল মুশরিকীনা ফী নারি জাহান্নামা খালিদীনা ফীহা, উলাইকা হুম শাররুল বারিয়্যাহ","ইন্নাল্লাযীনা আমানূ ওয়া আমিলুস সালিহাতি উলাইকা হুম খাইরুল বারিয়্যাহ","জাযাউহুম ইনদা রাব্বিহিম জান্নাতু আদনিন তাজরী মিন তাহতিহাল আনহারু খালিদীনা ফীহা আবাদা, রাদিয়াল্লাহু আনহুম ওয়া রাদূ আনহু, যালিকা লিমান খাশিয়া রাব্বাহ"],"m":["আহলে কিতাব ও মুশরিকদের মধ্যে যারা কুফরি করেছিল, তারা (নিজেদের অবস্থা থেকে) সরে আসত না, যতক্ষণ না তাদের কাছে সুস্পষ্ট প্রমাণ আসে—","আল্লাহর পক্ষ থেকে একজন রাসূল, যিনি পবিত্র সহিফাসমূহ পাঠ করেন,","যাতে আছে সঠিক ও মূল্যবান বিধান।","আর যাদের কিতাব দেওয়া হয়েছিল, তারা বিভেদ করেছে কেবল তাদের কাছে সুস্পষ্ট প্রমাণ আসার পরেই।","তাদের তো এই আদেশই দেওয়া হয়েছিল যে, তারা একনিষ্ঠভাবে আল্লাহর ইবাদত করবে, একমাত্র তাঁরই জন্য দ্বীনকে খাঁটি করে, নামাজ কায়েম করবে ও যাকাত দেবে; আর এটাই সঠিক দ্বীন।","আহলে কিতাব ও মুশরিকদের মধ্যে যারা কুফরি করেছে, তারা জাহান্নামের আগুনে স্থায়ীভাবে থাকবে; তারাই সৃষ্টির মধ্যে সবচেয়ে নিকৃষ্ট।","আর যারা ঈমান এনেছে ও সৎকর্ম করেছে, তারাই সৃষ্টির মধ্যে সর্বোত্তম।","তাদের প্রতিদান তাদের রবের কাছে চিরস্থায়ী জান্নাত, যার নিচ দিয়ে নদী বয়ে যায়; তারা সেখানে চিরকাল থাকবে। আল্লাহ তাদের উপর সন্তুষ্ট এবং তারাও তাঁর উপর সন্তুষ্ট। এটা তার জন্য, যে তার রবকে ভয় করে।"],"s":"কুরআন ৯৮:১-৮"},{"id":"s099","name":"সূরা আয-যিলযাল","cat":"sura","t":1,"r":false,"d":false,"a":["إِذَا زُلْزِلَتِ ٱلْأَرْضُ زِلْزَالَهَا","وَأَخْرَجَتِ ٱلْأَرْضُ أَثْقَالَهَا","وَقَالَ ٱلْإِنسَٰنُ مَا لَهَا","يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا","بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا","يَوْمَئِذٍ يَصْدُرُ ٱلنَّاسُ أَشْتَاتًا لِّيُرَوْا۟ أَعْمَٰلَهُمْ","فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُۥ","وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُۥ"],"u":["ইযা যুলযিলাতিল আরদু যিলযালাহা","ওয়া আখরাজাতিল আরদু আসকালাহা","ওয়া কালাল ইনসানু মা লাহা","ইয়াওমাইযিন তুহাদ্দিসু আখবারাহা","বিআন্না রাব্বাকা আওহা লাহা","ইয়াওমাইযিই ইয়াসদুরুন নাসু আশতাতাল লিইউরাও আ'মালাহুম","ফামাই ইয়া'মাল মিসকালা যাররাতিন খাইরাই ইয়ারাহ","ওয়া মাই ইয়া'মাল মিসকালা যাররাতিন শাররাই ইয়ারাহ"],"m":["যখন পৃথিবীকে তার প্রচণ্ড কম্পনে কাঁপিয়ে দেওয়া হবে,","আর পৃথিবী তার বোঝা বের করে দেবে,","আর মানুষ বলবে, “এর কী হলো?”","সেদিন সে তার সব খবর বলে দেবে,","কারণ আপনার রব তাকে আদেশ দিয়েছেন।","সেদিন মানুষ দলে দলে বের হবে, যাতে তাদের কৃতকর্ম তাদের দেখানো হয়।","অতএব যে অণু পরিমাণ ভালো কাজ করবে, সে তা দেখতে পাবে।","আর যে অণু পরিমাণ মন্দ কাজ করবে, সেও তা দেখতে পাবে।"],"s":"কুরআন ৯৯:১-৮"},{"id":"s100","name":"সূরা আল-আদিয়াত","cat":"sura","t":1,"r":false,"d":false,"a":["وَٱلْعَٰدِيَٰتِ ضَبْحًا","فَٱلْمُورِيَٰتِ قَدْحًا","فَٱلْمُغِيرَٰتِ صُبْحًا","فَأَثَرْنَ بِهِۦ نَقْعًا","فَوَسَطْنَ بِهِۦ جَمْعًا","إِنَّ ٱلْإِنسَٰنَ لِرَبِّهِۦ لَكَنُودٌ","وَإِنَّهُۥ عَلَىٰ ذَٰلِكَ لَشَهِيدٌ","وَإِنَّهُۥ لِحُبِّ ٱلْخَيْرِ لَشَدِيدٌ","۞ أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِى ٱلْقُبُورِ","وَحُصِّلَ مَ function lvl(dk){var t=total(dk);if(!t)return 0;var s=score(dk);return s<.25?1:s<.5?2:s<.8?3:4}
function streak(){var n=0,d=new Date();d.setHours(0,0,0,0);if(score(dkey(d))<.8)d=addDays(d,-1);while(score(dkey(d))>=.8&&n<3650){n++;d=addDays(d,-1)}return n}
function cnt(id,dk){var l=S.logs[dk||dkey(new Date())];return l&&l[id]||0}
function selD(){return S.dhikrs.filter(function(d){return d.id===S.sel})[0]||S.dhikrs[0]}
function tk(t,dk){return (t.daily?dk:t.date)+'|'+t.id}
function todayTasks(dk){
  var l=S.tasks.filter(function(t){return t.daily||t.date===dk||(t.date&&t.date<dk&&!S.done[tk(t,dk)])});
  return l.sort(function(a,b){var da=S.done[tk(a,dk)]?1:0,db=S.done[tk(b,dk)]?1:0;return da-db||mins(a.time||'23:59')-mins(b.time||'23:59')});
}
function hij(d){try{var dd=new Date(d.getTime()+S.set.off*864e5);
  var p=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(dd);
  function g(t){return parseInt(p.filter(function(x){return x.type===t})[0].value,10)}
  var o={d:g('day'),m:g('month'),y:g('year')};return (isNaN(o.d)||isNaN(o.m)||isNaN(o.y))?null:o}catch(e){return null}}
function hijriStr(d){var h=hij(d);return h?bn(h.d)+' '+HM[h.m-1]+' '+bn(h.y)+' হিজরি':''}

/* ---------- reminder schedule ---------- */
function slotsFor(date){
  var iv=Math.max(5,+S.set.interval||20),a=mins(S.set.from),b=mins(S.set.to),out=[];
  for(var m=a,k=0;m<=b;m+=iv,k++){var d=new Date(date);d.setHours(0,m,0,0);out.push({at:d,k:k})}
  return out;
}
function dhikrFor(date,k){
  var L=S.dhikrs.filter(function(x){return x.remind});if(!L.length)return null;
  var doy=Math.floor((date-new Date(date.getFullYear(),0,0))/864e5);return L[(k+doy)%L.length];
}
function nextSlot(){
  if(!S.set.remind)return null;var now=new Date();
  for(var i=0;i<2;i++){var d=addDays(now,i),sl=slotsFor(d);
    for(var j=0;j<sl.length;j++){if(sl[j].at>now){var dh=dhikrFor(d,sl[j].k);return dh?{at:sl[j].at,k:sl[j].k,dh:dh}:null}}}
  return null;
}
function webNotify(t,b){
  try{if('Notification' in window&&Notification.permission==='granted')new Notification(t,{body:b})}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([120,60,120])}catch(e){}
}
var firedT={};
function tick(){
  var now=new Date(),dk=dkey(now);
  if(S.set.remind){
    slotsFor(now).forEach(function(s){
      var diff=now-s.at;
      if(diff>=0&&diff<120000){var key=dk+'#'+s.k;
        if(S.lastFire!==key){S.lastFire=key;writeRaw(JSON.stringify(S));var dh=dhikrFor(now,s.k);if(dh)showReminder(dh)}}
    });
  }
  hourlySlots(now).forEach(function(d){
    var diff=now-d;
    if(diff>=0&&diff<120000){var key=dk+'h'+d.getHours();
      if(S.lastH!==key){S.lastH=key;writeRaw(JSON.stringify(S));showHourly(hourlyAt(d))}}
  });
  var hm=pad(now.getHours())+':'+pad(now.getMinutes());
  todayTasks(dk).forEach(function(t){
    if(t.time===hm&&!S.done[tk(t,dk)]&&!firedT[dk+t.id]){firedT[dk+t.id]=1;webNotify('কাজের সময়',t.title);toast('কাজের সময়: '+t.title)}
  });
  var nw=document.getElementById('nextWhen');if(nw){var ns=nextSlot();nw.textContent=ns?until(ns.at):''}
}
var nativeTimer=null;
function syncNativeSoon(){clearTimeout(nativeTimer);nativeTimer=setTimeout(syncNative,600)}
async function syncNative(){
  var LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;if(!LN)return;
  try{
    var p=await LN.checkPermissions();
    if(p.display!=='granted'){p=await LN.requestPermissions();if(p.display!=='granted')return}
    var pend=await LN.getPending();if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications});
    var list=[],id=1,now=new Date();
    if(S.set.remind)for(var i=0;i<3;i++){var d=addDays(now,i);slotsFor(d).forEach(function(s){
      if(s.at>now){var dh=dhikrFor(d,s.k);if(dh)list.push({id:id++,title:dh.name,body:lines(dh).a[0]+' · '+(lines(dh).m[0]||''),schedule:{at:s.at,allowWhileIdle:true}})}})}
    if(S.set.hourly)for(var i2=0;i2<3;i2++){var d2=addDays(now,i2);hourlySlots(d2).forEach(function(s,n){
      if(s>now){var x=hText(hourlyAt(s));list.push({id:5000+i2*30+n,title:x.t,body:x.b,schedule:{at:s,allowWhileIdle:true}})}})}
    S.tasks.forEach(function(t,n){
      if(!t.time)return;var hm=t.time.split(':').map(Number);
      if(t.daily)list.push({id:1000+n,title:'কাজের সময়',body:t.title,schedule:{on:{hour:hm[0],minute:hm[1]},allowWhileIdle:true,repeats:true}});
      else if(t.date){var at=new Date(t.date+'T'+t.time+':00');if(at>now)list.push({id:1000+n,title:'কাজের সময়',body:t.title,schedule:{at:at,allowWhileIdle:true}})}
    });
    if(list.length)await LN.schedule({notifications:list});
  }catch(e){}
}

/* ---------- hourly habit nudges ---------- */
var HK=['water','move','sura'];
var SURAS=['s108','s103','s110','ikhlas','s113','s114','s105','s106','s109','s097'];
function hourlySlots(date){
  if(!S.set.hourly)return [];
  var a=Math.ceil(mins(S.set.hFrom)/60),b=Math.floor(mins(S.set.hTo)/60),out=[];
  for(var h=a;h<=b&&h<24;h++){var d=new Date(date);d.setHours(h,0,0,0);out.push(d)}
  return out;
}
function hourlyAt(d){
  var h=d.getHours(),doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5),kind=HK[h%3];
  return kind==='sura'?{kind:kind,sid:SURAS[(doy+h)%SURAS.length]}:{kind:kind};
}
function hText(it){
  if(it.kind==='water')return {t:'পানি পান করুন',b:'এক গ্লাস পানি খেয়ে নিন।',b2:'এক গ্লাস পানি খেয়ে নিন।'};
  if(it.kind==='move')return {t:'একটু হাঁটুন',b:'উঠে একটু হাঁটুন, ঘাড় ও কাঁধ টান করুন।',b2:'উঠে একটু হাঁটুন, ঘাড় ও কাঁধ টান করুন।'};
  var L=LIBMAP[it.sid];return {t:'এখন একটু সূরা পড়ুন',b:L.name+' · '+L.a[0],b2:L.name};
}
function nextHourly(){
  if(!S.set.hourly)return null;var now=new Date();
  for(var i=0;i<2;i++){var d=addDays(now,i),sl=hourlySlots(d);
    for(var j=0;j<sl.length;j++)if(sl[j]>now)return {at:sl[j],it:hourlyAt(sl[j])}}
  return null;
}
function showHourly(it){
  var x=hText(it);webNotify(x.t,x.b);
  var h='<div class="rem counter"><p class="eyebrow">ঘণ্টার অভ্যাস</p><h2 style="margin:0">'+esc(x.t)+'</h2>';
  if(it.kind==='sura'){
    var L=LIBMAP[it.sid],n=Math.min(3,L.a.length);
    h+='<p class="mean">'+esc(L.name)+'</p>';
    for(var i=0;i<n;i++)h+='<div class="ar" dir="rtl" lang="ar">'+esc(L.a[i])+'</div><p class="pr">'+esc(L.u[i])+'</p><p class="mean">'+esc(L.m[i])+'</p>';
    if(L.a.length>n)h+='<p class="small muted">পুরো সূরা জিকির ট্যাবে আছে।</p>';
    h+='</div><div class="btns"><button class="btn primary" data-act="remInc" data-id="'+it.sid+'" data-n="1">পড়লাম (+১)</button><button class="btn" data-act="close">পরে</button></div>';

function buckets(r){
  var today=new Date();today.setHours(0,0,0,0);var out=[],i,j;
  if(r==='d'){for(i=6;i>=0;i--){var d=addDays(today,-i);out.push({label:DS[d.getDay()],days:[dkey(d)]})}}
  else if(r==='w'){var ws=addDays(today,-((today.getDay()+1)%7));
    for(i=7;i>=0;i--){var s=addDays(ws,-7*i),days=[];for(j=0;j<7;j++){var x=addDays(s,j);if(x<=today)days.push(dkey(x))}out.push({label:bn(s.getDate())+'/'+bn(s.getMonth()+1),days:days})}}
  else{for(i=5;i>=0;i--){var f=new Date(today.getFullYear(),today.getMonth()-i,1),nn=new Date(f.getFullYear(),f.getMonth()+1,0).getDate(),dd=[];
    for(j=1;j<=nn;j++){var y=new Date(f.getFullYear(),f.getMonth(),j);if(y<=today)dd.push(dkey(y))}out.push({label:MS[f.getMonth()],days:dd})}}
  return out;
}
function nice(v){if(v<=5)return 5;var p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function chart(b,vals){
  var W=340,H=200,L=36,R=6,T=18,B=26,max=nice(Math.max.apply(null,vals.concat([1]))),cw=(W-L-R)/b.length,bw=Math.min(30,cw*.6);
  var s='<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="জিকির সংখ্যার বার চার্ট">';
  [0,.5,1].forEach(function(f){var y=T+(H-T-B)*(1-f);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" class="grid"/><text x="'+(L-6)+'" y="'+(y+3.5)+'" text-anchor="end" class="axis">'+bn(Math.round(max*f))+'</text>'});
  b.forEach(function(x,i){var h=(H-T-B)*vals[i]/max,cx=L+cw*i+cw/2,y=H-B-h;
    s+='<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,0)+'" rx="4" class="bar'+(i===b.length-1?' cur':'')+'"/>';
    if(vals[i]>0)s+='<text x="'+cx+'" y="'+(y-4)+'" text-anchor="middle" class="val">'+bn(vals[i])+'</text>';
    s+='<text x="'+cx+'" y="'+(H-9)+'" text-anchor="middle" class="axis">'+x.label+'</text>'});
  return s+'</svg>';
}

    case 'interval':S.set.interval=+el.dataset.m;save();render();break;
    case 'theme':S.set.theme=el.dataset.v;applyTheme();save();render();break;
    case 'off':S.set.off=Math.max(-3,Math.min(3,S.set.off+(+el.dataset.d)));save();render();break;
    case 'testRem':var dh=dhikrFor(new Date(),0)||S.dhikrs[0];if(dh)showReminder(dh,true);break;
    case 'perm':
      try{Notification.requestPermission().then(function(r){toast(r==='granted'?'নোটিফিকেশন চালু হয়েছে':'অনুমতি দেওয়া হয়নি')})}catch(x){toast('এখানে নোটিফিকেশন সমর্থিত নয়। APK-তে কাজ করবে।')}
      syncNative();break;
    case 'copy':
      var txt=JSON.stringify(S);
      try{navigator.clipboard.writeText(txt).then(function(){toast('ব্যাকআপ কপি হয়েছে')},function(){toast('কপি হয়নি')})}catch(x){toast('কপি হয়নি')}
      break;
    case 'restore':
      try{var o=JSON.parse($('#rs').value);if(!o||!o.dhikrs)throw 0;S=o;save();applyTheme();render();toast('ব্যাকআপ ফেরত এসেছে')}catch(x){toast('ব্যাকআপটি ঠিক নয়')}
      break;
    case 'clearDemo':ask('নমুনা তথ্য মুছে নিজের তথ্য শুরু করবেন?','মুছুন',function(){
      var tdy=dkey(new Date());S.logs={};S.prayers={};S.done={};S.tasks=S.tasks.filter(function(x){return !x.sample});S.demo=false;S.logs[tdy]={};save();closeSheet();render()});break;
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='tD'){$('#tDW').hidden=el.checked;return}
  if(el.dataset&&el.dataset.set){var k=el.dataset.set,v=el.value;
    if(k==='interval'){v=Math.max(5,Math.min(720,parseInt(v,10)||20))}
    if((k==='from'||k==='to'||k==='hFrom'||k==='hTo')&&!v)return;
    S.set[k]=v;save();render()}
});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='q'){Q=e.target.value;var l=$('#libList');if(l)l.innerHTML=listHTML()}
});
document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target,id=f.dataset.id;
  if(f.dataset.form==='task'){
    var title=$('#tT').value.trim();if(!title)return;
    var o={id:id||uid(),title:title,cat:$('#tC').value,time:$('#tH').value,daily:$('#tD').checked,date:$('#tDate').value||dkey(new Date())};
    if(o.daily)delete o.date;
    if(id){S.tasks=S.tasks.map(function(x){return x.id===id?Object.assign({},x,o,{sample:false}):x})}else S.tasks.push(o);
    save();closeSheet();render();toast('কাজ সংরক্ষিত');
  }
  if(f.dataset.form==='dhikr'){
    var tg=Math.max(1,parseInt($('#dT').value,10)||33),rm=$('#dR').checked,gl=$('#dG').checked;
    if(f.dataset.lib==='1'){S.dhikrs.forEach(function(x){if(x.id===id){x.target=tg;x.remind=rm;x.goal=gl}})}
    else{
      var nm=$('#dN').value.trim();if(!nm)return;
      var dd={name:nm,arabic:$('#dA').value.trim(),meaning:$('#dM').value.trim(),target:tg,remind:rm,goal:gl,cat:'mine'};
      if(id){S.dhikrs=S.dhikrs.map(function(x){return x.id===id?Object.assign({},x,dd):x})}
      else{dd.id=uid();S.dhikrs.push(dd);S.sel=dd.id}
    }
    save();closeSheet();render();toast('জিকির সংরক্ষিত');
  }
});
function applyTheme(){var t=S.set.theme,r=document.documentElement;if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme')}
document.addEventListener('visibilitychange',function(){if(!document.hidden){tick();if(tab==='home')render();syncNativeSoon()}});

applyTheme();render();tick();setInterval(tick,10000);syncNativeSoon();
})();
</script>

</body></html>
